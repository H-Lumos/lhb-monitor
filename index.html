<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>龙虎榜监控 · 席位标签库</title>
<style>
:root{--bg:#0b0e14;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);
--txt:#e6e9ef;--mut:#8b93a7;--up:#ff5d6c;--dn:#2ecc8f;--gold:#e8b44a;
--blue:#4a9eff;--purple:#a678e8;--red:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);padding:16px;
font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1500px;margin:0 auto}
h1{font-size:19px;margin:0 0 3px;font-weight:600;letter-spacing:.3px}
.meta{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.datebar button{background:var(--card);border:1px solid var(--line);color:var(--txt);
width:36px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.datebar button:disabled{opacity:.32;cursor:default}
.dp{position:relative}
#dateBtn{background:var(--card);border:1px solid var(--line);color:var(--txt);
padding:8px 14px;border-radius:9px;font-size:14px;cursor:pointer;min-width:152px}
.datepanel{position:absolute;top:calc(100% + 6px);left:0;background:#171c26;border:1px solid var(--line);
border-radius:10px;max-height:320px;overflow-y:auto;z-index:200;display:none;min-width:162px;
box-shadow:0 10px 28px rgba(0,0,0,.65);-webkit-overflow-scrolling:touch}
.datepanel.show{display:block}
.datepanel div{padding:11px 16px;font-size:14px;cursor:pointer;color:var(--txt);white-space:nowrap}
.datepanel div:active{background:rgba(255,255,255,.08)}
.datepanel div.on{background:rgba(74,158,255,.22);color:var(--blue);font-weight:600}
.datebar .hint{color:var(--mut);font-size:11.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(4,1fr);gap:8px}}
@media(max-width:520px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .v{font-size:23px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.card .k{color:var(--mut);font-size:11.5px;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--mut);
padding:7px 15px;border-radius:9px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:rgba(255,93,108,.14);border-color:var(--red);color:#ff8792;font-weight:500}
#q{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);color:var(--txt);
border-radius:9px;padding:8px 13px;font-size:13px;outline:none}
#q::placeholder{color:#5c6478}
.pills{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);color:var(--mut);
padding:5px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.pill.on{background:rgba(74,158,255,.16);border-color:var(--blue);color:var(--blue)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{text-align:right;color:var(--mut);font-weight:500;font-size:11.5px;padding:10px;
border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:nth-child(1),th:nth-child(2),th:nth-child(3){text-align:left}
th.asc::after{content:" ↑"}th.desc::after{content:" ↓"}
td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;
font-variant-numeric:tabular-nums}
td:nth-child(1),td:nth-child(2),td:nth-child(3){text-align:left}
tr.body{cursor:pointer}tr.body:hover{background:rgba(255,255,255,.035)}
.star{color:var(--gold);margin-right:3px}
.fav{cursor:pointer;font-size:14px;margin-right:5px;opacity:.4;user-select:none;
display:inline-block;width:14px;text-align:center;transition:opacity .15s,transform .15s;vertical-align:middle}
.fav:hover{opacity:.85;transform:scale(1.15)}
.fav.on{opacity:1;color:#ff5d6c}
.favcnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;
background:rgba(255,93,108,.22);color:#ff5d6c;font-size:10px;font-weight:700;vertical-align:middle}
.favcnt:empty{display:none}
.nm{font-weight:500}.code{color:var(--mut);font-size:11px;margin-left:5px}
.mkt{color:var(--mut);font-size:12px}
.why{color:var(--mut);font-size:12px;max-width:330px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.zero{color:var(--mut)}
.detail td{background:rgba(255,255,255,.022);padding:0}
.reason{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.rtitle{color:var(--gold);font-size:12.5px;margin-bottom:9px;font-weight:500}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.rgrid{grid-template-columns:1fr;gap:10px}}
.rhd{display:grid;grid-template-columns:1fr 92px 62px 62px;gap:8px;color:var(--mut);
font-size:10.5px;padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.07);margin-bottom:4px}
.rhd span:nth-child(n+2){text-align:right}
.sr{display:grid;grid-template-columns:1fr 92px 62px 62px;gap:8px;padding:4px 0;
font-size:11.5px;align-items:center;border-bottom:1px dotted rgba(255,255,255,.04)}
.sr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.tg{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px;vertical-align:middle}
.tg-north,.tg-inst{background:rgba(74,158,255,.16);color:var(--blue)}
.tg-quant{background:rgba(166,120,232,.18);color:var(--purple)}
.tg-hot{background:rgba(232,180,74,.16);color:var(--gold)}
.tg-desk{background:rgba(255,255,255,.07);color:var(--mut)}
.cf{display:inline-block;font-size:9px;font-weight:700;padding:0 3px;border-radius:2px;
margin-left:3px;vertical-align:middle;line-height:1.6}
.cf.a{background:rgba(46,204,143,.2);color:#2ecc8f}
.cf.b{background:rgba(232,180,74,.2);color:#e8b44a}
.cf.c{background:rgba(139,147,167,.22);color:#8b93a7}
.dim{opacity:.5}
.empty{color:var(--mut);text-align:center;padding:46px 0;font-size:13px}
.loading{color:var(--mut);text-align:center;padding:46px 0;font-size:13px}
</style></head><body><div class="wrap">
<h1>🐉 龙虎榜监控 · 席位标签库</h1>
<div class="meta" id="meta">加载中…</div>

<div class="datebar">
  <button id="prev" title="上一交易日">◀</button>
  <div class="dp"><button id="dateBtn">—</button><div class="datepanel" id="datePanel"></div></div>
  <button id="next" title="下一交易日">▶</button>
  <span class="hint" id="hint"></span>
</div>

<div class="cards" id="cards"></div>

<div class="toolbar">
  <div class="tabs">
    <div class="tab on" data-tab="stock">股票</div>
    <div class="tab" data-tab="watch">次日关注</div>
  </div>
  <input id="q" placeholder="搜索 名称/代码...">
</div>
<div class="pills">
  <div class="pill on" data-f="all">全部</div>
  <div class="pill" data-f="watch">次日关注</div>
  <div class="pill" data-f="inst">机构净买</div>
  <div class="pill" data-f="hot">游资净买</div>
  <div class="pill" data-f="north">北向净买</div>
  <div class="pill" data-f="fav">我的自选<span class="favcnt" id="favcnt">0</span></div>
</div>

<div class="scroll">
<table><thead><tr>
<th data-s="name">标的</th><th data-s="market">板块</th><th data-s="chg">涨幅</th><th data-s="why">风口/原因</th>
<th data-s="net" class="desc">净买入</th><th data-s="inst">机构净买</th>
<th data-s="hot">游资净买</th><th data-s="n">原因数</th>
</tr></thead><tbody id="tb"></tbody></table>
</div>
<div class="empty" id="empty" style="display:none">没有符合条件的记录</div>
</div>
<script>
const MK={'上交所主板':'沪主板','深交所主板':'深主板','上交所科创板':'科创板','深交所创业板':'创业板'};
let DATA=[], dates=[], cur=0, filt='all', tab='stock', sk='net', sd=-1, kw='';
let FAV=new Set();
try{FAV=new Set(JSON.parse(localStorage.getItem('lhb_fav')||'[]'));}catch(e){FAV=new Set();}

function saveFav(){try{localStorage.setItem('lhb_fav',JSON.stringify([...FAV]));}catch(e){}}
function syncFavCnt(){const el=document.getElementById('favcnt');if(el){el.textContent=FAV.size;el.style.display=FAV.size?'inline-block':'none';}}
function toggleFav(code,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  FAV.has(code)?FAV.delete(code):FAV.add(code);
  saveFav(); render(); syncFavCnt();
}
const yi=v=>{const a=Math.abs(v)/1e8;return (v<0?'-':'')+a.toFixed(2)+'亿';};
const cs=v=>v>0?'up':(v<0?'dn':'zero');
const tcls=c=>c==='北向'?'tg-north':c==='机构'?'tg-inst':c==='量化'?'tg-quant':c==='营业部'?'tg-desk':'tg-hot';
const mk=s=>(MK[s]||s||'').replace('交易市场','');
const money=v=>(v/1e4).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');

function seats(list){
  if(!list||!list.length) return '<div class="sr"><span class="zero">—</span></div>';
  return list.map(x=>`<div class="sr${x.conf&&x.conf[0]==='C'?' dim':''}">
    <span title="${x.dept}">${x.dept}</span>
    <span><span class="tg ${tcls(x.cat)}">${x.tag==='T王'?'T王':x.cat+'·'+(x.tag||'')}</span>${x.conf?'<span class="cf '+(x.conf[0]==='A'?'a':x.conf[0]==='B'?'b':'c')+'">'+x.conf[0]+'</span>':''}</span>
    <span class="${x.buy>0?'':'zero'}">${(x.buy/1e4).toFixed(0)}</span>
    <span class="${x.sell>0?'':'zero'}">${(x.sell/1e4).toFixed(0)}</span></div>`).join('');
}
function detail(r){
  const q = `<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05);
    font-size:12px;color:#8b93a7;display:flex;flex-wrap:wrap;gap:6px 16px">
    <span>涨幅 <b class="${r.chg>0?'up':(r.chg<0?'dn':'')}">${(r.chg>0?'+':'')+r.chg.toFixed(2)}%</b></span>
    <span>换手 <b style="color:#e6e9ef">${r.turn}%</b></span>
    <span>成交额 <b style="color:#e6e9ef">${(r.amount/1e8).toFixed(2)}亿</b></span>
    <span>流通 <b style="color:#e6e9ef">${(r.cap/1e8).toFixed(0)}亿</b></span>
    <span>量化净买 <b class="${(r.quant||0)>0?'up':'dn'}">${((r.quant||0)<0?'-':'')+Math.abs((r.quant||0)/1e8).toFixed(2)}亿</b></span>
    <span>T王净买 <b class="${(r.tw||0)>0?'up':'dn'}">${((r.tw||0)<0?'-':'')+Math.abs((r.tw||0)/1e8).toFixed(2)}亿</b></span>
  </div>`;
  return q + r.reasons.map(z=>`<div class="reason">
    <div class="rtitle">上榜原因：${z.explanation}（买${money(z.buy_amt)}万 / 卖${money(z.sell_amt)}万）</div>
    <div class="rgrid">
      <div><div class="rhd"><span>买入营业部</span><span>标签</span><span>买入(万)</span><span>卖出(万)</span></div>${seats(z.buy_seats)}</div>
      <div><div class="rhd"><span>卖出营业部</span><span>标签</span><span>买入(万)</span><span>卖出(万)</span></div>${seats(z.sell_seats)}</div>
    </div></div>`).join('');
}
function cards(){
  const S=DATA, n=S.length;
  const ni=S.filter(r=>r.inst>0).length, nh=S.filter(r=>r.hot>0).length;
  const nw=S.filter(r=>r.watch).length;
  const it=S.reduce((a,b)=>a+b.inst,0)/1e8, ht=S.reduce((a,b)=>a+b.hot,0)/1e8,
        nt=S.reduce((a,b)=>a+b.north,0)/1e8, qt=S.reduce((a,b)=>a+(b.quant||0),0)/1e8,
        tw=S.reduce((a,b)=>a+(b.tw||0),0)/1e8;
  document.getElementById('cards').innerHTML=`
   <div class="card"><div class="v">${n}</div><div class="k">上榜</div></div>
   <div class="card"><div class="v">${ni}</div><div class="k">机构买入</div></div>
   <div class="card"><div class="v">${nh}</div><div class="k">游资活跃</div></div>
   <div class="card"><div class="v">${nw}</div><div class="k">次日关注</div></div>
   <div class="card"><div class="v ${it>0?'up':'dn'}">${(it<0?'-':'')+Math.abs(it).toFixed(2)}亿</div><div class="k">机构净买</div></div>
   <div class="card"><div class="v ${ht>0?'up':'dn'}">${(ht<0?'-':'')+Math.abs(ht).toFixed(2)}亿</div><div class="k">游资净买</div></div>
   <div class="card"><div class="v ${qt>0?'up':'dn'}">${(qt<0?'-':'')+Math.abs(qt).toFixed(2)}亿</div><div class="k">量化净买</div></div>
   <div class="card"><div class="v ${tw>0?'up':'dn'}">${(tw<0?'-':'')+Math.abs(tw).toFixed(2)}亿</div><div class="k">T王净买</div></div>
   <div class="card"><div class="v ${nt>0?'up':'dn'}">${(nt<0?'-':'')+Math.abs(nt).toFixed(2)}亿</div><div class="k">北向净买</div></div>`;
}
function render(){
  let rows=DATA.slice();
  if(tab==='watch'||filt==='watch') rows=rows.filter(r=>r.watch);
  if(filt==='inst') rows=rows.filter(r=>r.inst>0);
  if(filt==='hot') rows=rows.filter(r=>r.hot>0);
  if(filt==='north') rows=rows.filter(r=>r.north>0);
  if(filt==='fav') rows=rows.filter(r=>FAV.has(r.code));
  if(kw){const k=kw.toLowerCase();rows=rows.filter(r=>
    (r.name||'').toLowerCase().includes(k)||(r.code||'').includes(k)||
    (r.reasons||[]).some(z=>(z.buy_seats||[]).concat(z.sell_seats||[])
      .some(x=>(x.dept||'').toLowerCase().includes(k)||(x.tag||'').toLowerCase().includes(k))));}
  rows.sort((a,b)=>{
    if(sk==='name')return sd*String(a.name).localeCompare(String(b.name),'zh');
    if(sk==='market')return sd*mk(a.market).localeCompare(mk(b.market),'zh');
    if(sk==='why')return sd*String(a.reasons[0]?.explanation||'').localeCompare(String(b.reasons[0]?.explanation||''),'zh');
    if(sk==='n')return sd*(a.reasons.length-b.reasons.length);
    return sd*((a[sk]||0)-(b[sk]||0));});
  document.getElementById('tb').innerHTML=rows.map((r,i)=>`<tr class="body" data-i="${i}">
    <td><span class="fav ${FAV.has(r.code)?'on':''}" data-c="${r.code}"
      onclick="toggleFav('${r.code}',event)">${FAV.has(r.code)?'♥':'♡'}</span>${r.watch?'<span class="star">★</span>':''}<span class="nm">${r.name}</span><span class="code">${r.code}</span></td>
    <td><span class="mkt">${mk(r.market)}</span></td>
    <td class="${r.chg>0?'up':(r.chg<0?'dn':'zero')}">${(r.chg>0?'+':'')+r.chg.toFixed(2)}%</td>
    <td><div class="why" title="${r.reasons.map(z=>z.explanation).join(' | ')}">${r.reasons[0]?.explanation||''}</div></td>
    <td class="${cs(r.net)}">${yi(r.net)}</td><td class="${cs(r.inst)}">${yi(r.inst)}</td>
    <td class="${cs(r.hot)}">${yi(r.hot)}</td><td class="zero">${r.reasons.length}</td></tr>
   <tr class="detail" data-d="${i}" style="display:none"><td colspan="8">${detail(r)}</td></tr>`).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  if(filt==='fav'&&!rows.length){
    document.getElementById('empty').textContent = FAV.size
      ? '当前日期没有自选标的（共 '+FAV.size+' 只，换个日期看看）'
      : '还没有自选，点标的左侧的 ♡ 收藏';
  } else {
    document.getElementById('empty').textContent = '没有符合条件的记录';
  }
  document.querySelectorAll('tr.body').forEach(el=>el.onclick=()=>{
    const d=document.querySelector('tr[data-d="'+el.dataset.i+'"]');
    d.style.display=d.style.display==='none'?'table-row':'none';});
}
async function load(idx){
  cur=idx;
  const d=dates[idx];
  document.getElementById('hint').textContent='';
  document.getElementById('tb').innerHTML='<tr><td colspan="8"><div class="loading">加载…</div></td></tr>';
  try{
    const r=await fetch('lhb_history/'+d+'.json?t='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    DATA=j.stocks||[];
    document.getElementById('meta').textContent=d+' ｜ 点点个股行展开「上榜原因 → 买卖营业部」详情';
    document.getElementById('dateBtn').textContent=d+' ▾';
    document.querySelectorAll('#datePanel div').forEach((el,i)=>
      el.classList.toggle('on', i===idx));
    document.getElementById('prev').disabled=(idx>=dates.length-1);
    document.getElementById('next').disabled=(idx<=0);
    cards();render();
  }catch(e){
    document.getElementById('hint').textContent='加载失败：'+e.message;
    document.getElementById('tb').innerHTML='';
  }
}
async function boot(){
  try{
    const r=await fetch('lhb_history/index.json?t='+Date.now(),{cache:'no-store'});
    dates=(await r.json()).slice().reverse();   // 最新在前
    if(!dates.length){document.getElementById('meta').textContent='暂无历史数据';return;}
    const panel=document.getElementById('datePanel');
    panel.innerHTML=dates.map((d,i)=>`<div data-i="${i}" class="${i===0?'on':''}">${d}</div>`).join('');
    panel.querySelectorAll('div').forEach(el=>el.onclick=()=>{
      panel.classList.remove('show'); load(parseInt(el.dataset.i,10));});
    document.getElementById('dateBtn').onclick=e=>{
      e.stopPropagation(); panel.classList.toggle('show');};
    document.addEventListener('click',e=>{
      if(!panel.contains(e.target) && e.target.id!=='dateBtn') panel.classList.remove('show');});
    document.getElementById('prev').onclick=()=>{if(cur<dates.length-1)load(cur+1)};
    document.getElementById('next').onclick=()=>{if(cur>0)load(cur-1)};
    load(0);
  }catch(e){
    document.getElementById('meta').textContent='需通过 http 访问才能读取历史数据';
  }
}
document.getElementById('q').oninput=e=>{kw=e.target.value.trim();render()};
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
  p.classList.add('on');filt=p.dataset.f;render();});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');tab=t.dataset.tab;render();});
document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.s;
  document.querySelectorAll('th').forEach(x=>x.classList.remove('asc','desc'));
  if(sk===k) sd=-sd; else {sk=k;sd=-1;}
  th.classList.add(sd>0?'asc':'desc');render();});
boot();
</script><div id="pagever" style="text-align:center;color:#4a5568;font-size:11px;padding:16px 0 22px">—</div>
<script>document.getElementById('pagever').textContent='页面版本 '+document.lastModified;</script>
</body></html>
